name: Slice (bounded work item)
description: One vertical slice with acceptance criteria. Maps to docs/templates/TASK.md.
labels: ["type:slice", "stage:build", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Public repository. Include addresses, hashes, finding IDs and doc paths only.
        Never paste game bytes, extracted assets or decompiled code.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Matches the area:* label and docs/AREAS.md.
      options: [binding, assets-containers, assets-types, world-data, collision-nav, streaming, environment, traversal, statemachine, motion, warping, trajectory, ik, modifiers, crowd, ai-awareness, ai-navigation, combat, render, audio, video, ui, mission, save, progression, coop, physics, tooling, infra]
    validations: {required: true}
  - type: textarea
    id: question
    attributes:
      label: Question and bounded scope
      description: One result, small enough for one branch and PR.
    validations: {required: true}
  - type: input
    id: finding
    attributes:
      label: Finding this implements
      description: ACU-RE-NNNN and the research issue (#N). If none exists, add label needs-finding and link the research issue that will produce one. See docs/RESEARCH_TO_BUILD.md.
  - type: textarea
    id: inputs
    attributes:
      label: Inputs and existing evidence
      description: Findings (ACU-RE-NNNN), VAs, corpus paths, archive/file IDs, docs.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable outcome, independent validation, limits/unsupported cases.
    validations: {required: true}
  - type: textarea
    id: depends
    attributes:
      label: Depends on
      description: "Issue numbers, e.g. #12. The slice is ready only when all are Done."
  - type: textarea
    id: owned
    attributes:
      label: Owned files and shared-file edits
      description: Files this slice may edit (new module/crate), and any shared file it must touch.
  - type: checkboxes
    id: locks
    attributes:
      label: Resource locks needed
      options:
        - label: lock:game-process (ACU.exe, probe pipe, virtual pad, debug registers)
        - label: lock:ida-rea-session
        - label: lock:capture-run-dir
  - type: dropdown
    id: size
    attributes:
      label: Size
      options: [S (hours), M (a day), L (multi-day, consider splitting)]
  - type: dropdown
    id: who
    attributes:
      label: Who may take it
      options: [agent-ok, human-only]
