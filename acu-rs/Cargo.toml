[workspace]
members = ["crates/acu_assets", "crates/acu_bevy"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
bevy = { version = "=0.19.1", default-features = false }
lzokay = { version = "=2.0.1", default-features = false, features = ["decompress"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
